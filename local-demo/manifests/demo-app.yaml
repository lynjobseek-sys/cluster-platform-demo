# Phase 3: replace the single hub-only Application with an ApplicationSet
# that fans out to every registered cluster (hub, dev, prod). Each generated
# Application points at the same podinfo Helm chart but installs into the
# 'demo' namespace of its target cluster.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-podinfo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'demo-podinfo-{{ .name }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://stefanprodan.github.io/podinfo
        chart: podinfo
        targetRevision: 6.7.1
        helm:
          releaseName: demo-podinfo
          values: |
            replicaCount: 1
            ingress:
              enabled: false
            serviceMonitor:
              enabled: false
      destination:
        server: '{{ .server }}'
        namespace: demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
