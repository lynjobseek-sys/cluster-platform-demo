# vault-secrets-operator (VSO) reconciles VaultStaticSecret / VaultDynamicSecret
# CRs into native k8s Secrets. The operator itself is cluster-scoped; the
# per-team CRs (VaultConnection, VaultAuth, VaultStaticSecret) live in the
# team's namespace and are delivered by the simpleOnboarding ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault-secrets-operator
    targetRevision: 0.9.1
    helm:
      releaseName: vault-secrets-operator
      values: |
        defaultVaultConnection:
          enabled: false
        defaultAuthMethod:
          enabled: false
        controller:
          replicas: 1
          manager:
            clientCache:
              persistenceModel: ""
              cacheSize: 100
  destination:
    name: in-cluster
    namespace: vault-secrets-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
