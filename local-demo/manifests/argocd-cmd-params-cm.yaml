apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Server-side diff lets the application-controller compute diffs on the
  # API server, which avoids client-side terminatingReplicas ComparisonError
  # noise on StatefulSets like Prometheus and AlertManager.
  controller.diff.server.side: "true"

  # Git directory generators are off by default in 2.12. Enable them and
  # close the SCM provider attack surface that the same flag would open.
  applicationsetcontroller.enable.git.generators: "true"
  applicationsetcontroller.allowed.scm.providers: ""
  applicationsetcontroller.enable.scm.providers: "false"
