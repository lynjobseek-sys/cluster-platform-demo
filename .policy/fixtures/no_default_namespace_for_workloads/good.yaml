apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: data-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/worker:0.9.1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
