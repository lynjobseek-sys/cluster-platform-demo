# Synced k8s Secret name is data-vault-config. Refresh interval 30s
# is fine for a demo; production should pair with rolloutRestartTargets.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: data-vault-config
  namespace: data-local
spec:
  vaultAuthRef: data-vault-auth
  mount: secret
  type: kv-v2
  path: data/config
  refreshAfter: 30s
  destination:
    name: data-vault-config
    create: true
