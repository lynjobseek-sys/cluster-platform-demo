apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.team }}-rules
  labels:
    team: {{ .Values.team }}
    # Picked up by the Prometheus operator's default ruleSelector.
    release: kube-prometheus-stack
spec:
  groups:
    - name: {{ .Values.team }}.rules
      rules:
        - alert: PodCrashLoopingForTeam
          # Anything restarting faster than once every 5 minutes in this
          # team's namespaces. Held for 10m so a single crash doesn't fire.
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"{{ .Values.team }}-.*"}[5m]) > 0
            and on (namespace, pod) kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",namespace=~"{{ .Values.team }}-.*"} == 1
          for: 10m
          labels:
            severity: warning
            team: {{ .Values.team }}
          annotations:
            summary: "Pod crash looping ({{`{{ $labels.namespace }}/{{ $labels.pod }}`}})"
            description: "Container in pod {{`{{ $labels.namespace }}/{{ $labels.pod }}`}} has restarted in the last 5m and is in CrashLoopBackOff."
        - alert: NamespacePodNotReady
          expr: |
            sum by (namespace) (kube_pod_status_ready{condition="false",namespace=~"{{ .Values.team }}-.*"}) > 0
          for: 15m
          labels:
            severity: warning
            team: {{ .Values.team }}
          annotations:
            summary: "Pods not ready in {{`{{ $labels.namespace }}`}}"
            description: "At least one pod in {{`{{ $labels.namespace }}`}} has been NotReady for 15m."
