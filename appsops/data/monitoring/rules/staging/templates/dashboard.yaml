apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.team }}-overview-dashboard
  labels:
    # The Grafana sidecar in kube-prometheus-stack auto-discovers any
    # ConfigMap with this label and mounts it into Grafana.
    grafana_dashboard: "1"
    team: {{ .Values.team }}
data:
  {{ .Values.team }}-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Running pods ({{ .Values.team }}-*)",
          "id": 1,
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Running\",namespace=~\"{{ .Values.team }}-.*\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Container restarts rate ({{ .Values.team }}-*)",
          "id": 2,
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 6},
          "targets": [
            {
              "expr": "sum by (namespace, pod) (rate(kube_pod_container_status_restarts_total{namespace=~\"{{ .Values.team }}-.*\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{`{{namespace}}/{{pod}}`}}"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["{{ .Values.team }}", "platform"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "",
      "title": "{{ .Values.team }} overview",
      "uid": "{{ .Values.team }}-overview",
      "version": 1
    }
