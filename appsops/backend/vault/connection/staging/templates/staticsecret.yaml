# Synced k8s Secret name is backend-vault-config. Refresh interval 30s
# is fine for a demo; production should pair with rolloutRestartTargets.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: backend-vault-config
  namespace: backend-staging
spec:
  vaultAuthRef: backend-vault-auth
  mount: secret
  type: kv-v2
  path: backend/config
  refreshAfter: 30s
  destination:
    name: backend-vault-config
    create: true
