# Synced k8s Secret name is frontend-vault-config. Refresh interval 30s
# is fine for a demo; production should pair with rolloutRestartTargets.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: frontend-vault-config
  namespace: frontend-staging
spec:
  vaultAuthRef: frontend-vault-auth
  mount: secret
  type: kv-v2
  path: frontend/config
  refreshAfter: 30s
  destination:
    name: frontend-vault-config
    create: true
